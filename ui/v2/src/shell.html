<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya+Sans+SC:wght@500;700&family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap">

<!--@ART@-->
<div id="stage" lang="tr">
  <div class="rig">
    <div id="phone" class="phone">
      <div id="game" class="game" data-mode="frame">
        <div class="room" aria-hidden="true"><svg class="room-pat" preserveAspectRatio="xMidYMid slice"><rect width="100%" height="100%" fill="url(#p-halkari)"/></svg></div>
        <div id="board" class="board">
          <svg id="carpet" class="carpet" viewBox="0 0 734 372" aria-hidden="true"></svg>
          <div class="hush" aria-hidden="true"></div>
          <div id="tray" class="tray"></div>
          <div id="placed" class="placed"></div>
          <div id="seats" class="seats"></div>
          <div id="me" class="me"></div>
          <div id="hand" class="hand"></div>
          <div id="act" class="act"></div>
          <div id="hud" class="hud"></div>
          <div id="fx" class="fx"></div>
        </div>
        <div id="scrim" class="scrim" hidden></div>
        <div id="moment" class="moment board" hidden></div>
        <div id="sheet" class="sheetwrap" hidden></div>
        <div id="rotate" class="rotate" hidden><div class="rot-phone"></div><p>Telefonu yan çevir</p></div>
      </div>
      <i class="island" aria-hidden="true"></i><i class="homebar" aria-hidden="true"></i>
    </div>
    <div class="devbar" id="devbar"></div>
  </div>
  <main class="spec" id="spec"><!--@SPEC@--></main>
